<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Quản lý Thư viện</title>
  <link rel="stylesheet" href="login-styles.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>📚 Thư viện</h1>
        <p>Hệ thống Quản lý Thư viện</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="username">Mã nhân viên</label>
          <input 
            type="text" 
            id="username" 
            placeholder="VD: nv01" 
            required
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input 
            type="password" 
            id="password" 
            placeholder="Nhập mật khẩu" 
            required
          >
        </div>

        <div id="errorMsg" class="error-message"></div>

        <button type="submit" class="login-btn">Đăng nhập</button>

        <div class="login-hint">
          <p><strong>Tài khoản mẫu:</strong></p>
          <ul>
            <li>Nhân viên: <code>nv01</code> / <code>123456</code></li>
            <li>Quản lý: <code>ql01</code> / <code>123456</code></li>
          </ul>
        </div>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
